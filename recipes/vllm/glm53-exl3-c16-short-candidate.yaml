# Candidate: not GPU-validated; benchmark and correctness-gate before promotion.
recipe_version: '2'
name: glm53-exl3-c16-short-candidate
description: EXL3 K7 short-context c16 candidate; graph shapes through128; skip mixed-prefill policy can starve arrivals.
model: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw
runtime: vllm
container: ghcr.io/spark-arena/glm-5.3-flash-2x-dgx-sparks:exl3-94f5d38
min_nodes: 2
max_nodes: 2
cluster_only: true
defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  distributed_executor_backend: mp
  quantization: exl3
  load_format: instanttensor
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.84
  max_model_len: 32768
  max_num_batched_tokens: 2048
  max_num_seqs: 16
  served_model_name: GLM-5.3-Flash-EXL3
  revision: 024db9f7e9871e8efdf21538ba55af7442be3cd5
  local_speculative_config: '{"method":"dflash","model":"/cache/huggingface/hub/models--incoai--GLM-5.3-Flash-DFlash2/snapshots/7d74cdd881ed7e32c31175984a67823127b66cfe","num_speculative_tokens":7,"kv_cache_dtype":"auto","draft_tensor_parallel_size":1,"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}'
executor_config:
  entrypoint: ''
  user: root
  shm_size: 32gb
  cap_add:
  - IPC_LOCK
  - SYS_PTRACE
  ulimits:
  - memlock=-1:-1
  - stack=67108864
  - nofile=65535:65535
env:
  EXL3_FUSED_MOE: '1'
  EXL3_MOE_ROW_TILE: '0'
  EXL3_TEMP_ROWS_FUSED: '128'
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  GLM53_BOOT_SHAPE_WARMUP: '1'
  GLM53_MIXED_PREFILL_CHUNK: skip
  GLM53_SUPPRESS_STOPS_IN_REASONING: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '1'
  VLLM_NO_USAGE_STATS: '1'
  DO_NOT_TRACK: '1'
  NCCL_CROSS_NIC: '0'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_IB_MERGE_NICS: '0'
  NCCL_NVLS_ENABLE: '0'
  NCCL_NET_PLUGIN: none
  NCCL_IB_GID_INDEX: '3'
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  GLOO_SOCKET_IFNAME: enp1s0f1np1
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
pre_exec:
- python3 /opt/glm53/patch_glm_video_placeholders.py
- python3 /opt/glm53/patch_suppress_stops_in_reasoning.py
- python3 /opt/glm53/patch_scheduler_decode_floor.py
- python3 /opt/glm53/patch_glm5_drafter_group.py
- python3 /opt/glm53/patch_hybrid_prefix_hit.py
- python3 /opt/glm53/patch_xgrammar_termination.py
command: |
  taskset -c 5-9,15-19 vllm serve {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --distributed-executor-backend {distributed_executor_backend} \
    --quantization {quantization} \
    --load-format {load_format} \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --reasoning-parser glm45 \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --chat-template /opt/glm53/chat_template.jinja \
    --limit-mm-per-prompt '{{"image":4,"video":1}}' \
    --skip-mm-profiling \
    --cudagraph-capture-sizes 1 2 4 8 16 24 32 64 128 \
    --speculative-config '{local_speculative_config}'
builder: ursuciprian
