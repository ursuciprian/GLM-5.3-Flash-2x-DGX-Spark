description: GLM-5.3-Flash NVFP4 (RedHatAI) TP=2 - NVFP4 + DFlash2, direct-IO load, TP=2 over CX-7
model: RedHatAI/GLM-5.3-Flash-NVFP4
container: ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2
runtime: vllm-distributed

min_nodes: 2
max_nodes: 2

metadata:
  description: GLM-5.3-Flash NVFP4 (RedHatAI) + DFlash2 k=7, TP=2
  model_dtype: nvfp4
  source: https://github.com/tonyd2wild/GLM-5.3-Flash-NVFP4-DFlash2-2x-DGX-Spark

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 6
  load_format: fastsafetensors
  max_num_batched_tokens: 8192
  block_size: 2304
  num_speculative_tokens: 7
  kv_cache_memory: 3221225472
  served_model_name: glm-5.3-flash
  revision: 36c184c6cda000a481711306df5adde42f63321a
  draft_path: /cache/huggingface/hub/models--incoai--GLM-5.3-Flash-DFlash2/snapshots/7d74cdd881ed7e32c31175984a67823127b66cfe

executor_config:
  entrypoint: ''
  shm_size: 32gb
  cap_add:
    - IPC_LOCK
    - SYS_PTRACE
  ulimits:
    - memlock=-1:-1
  devices:
    - /dev/infiniband:/dev/infiniband
  volumes:
    - /home/nvidia/GEN-AI/glm53/patches/sparse_attn_indexer_kpool_sm121.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/sparse_attn_indexer_kpool.py:ro
    - /home/nvidia/GEN-AI/glm53/patches/chat_template_mm.jinja:/models/chat_template_mm.jinja:ro

env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  NCCL_IB_DISABLE: '0'
  NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1
  NCCL_IB_GID_INDEX: '3'
  NCCL_IB_ROCE_VERSION_NUM: '2'
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_SOCKET_IFNAME: enp1s0f1np1
  NCCL_NVLS_ENABLE: '0'
  NCCL_CROSS_NIC: '1'
  NCCL_IB_MERGE_NICS: '0'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_IGNORE_CPU_AFFINITY: '1'
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: '1'

command: |
  vllm serve {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --block-size {block_size} \
    --moe-backend marlin \
    --speculative-config '{{"method":"dflash","model":"{draft_path}","num_speculative_tokens":{num_speculative_tokens}}}' \
    --kv-cache-dtype fp8_e4m3 \
    --kv-cache-memory {kv_cache_memory} \
    --enforce-eager \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --tool-call-parser glm47 --enable-auto-tool-choice \
    --reasoning-parser glm45 \
    --default-chat-template-kwargs '{{"enable_thinking":false}}' \
    --chat-template /models/chat_template_mm.jinja \
    --distributed-executor-backend mp

recipe_version: '1'
builder: ursuciprian
